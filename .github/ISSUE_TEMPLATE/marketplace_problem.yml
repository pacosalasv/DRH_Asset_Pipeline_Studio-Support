name: Marketplace / distribution problem
description: Report an installation, listing, package, or delivery problem for DRH - Asset Pipeline Studio.
title: "[Distribution]: "
labels:
  - marketplace problem
body:
  - type: markdown
    attributes:
      value: |
        DRH - Asset Pipeline Studio is currently in development. Use this form for development-package, installation, or delivery problems.

  - type: input
    id: product_version
    attributes:
      label: Product version
      placeholder: "Example: 1.0.0"
    validations:
      required: true

  - type: textarea
    id: problem_summary
    attributes:
      label: Problem summary
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual result
    validations:
      required: true
